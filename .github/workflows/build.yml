name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/host
      - name: Test
        run: ctest --test-dir build/host --output-on-failure

  android:
    name: Android arm64-v8a .levipack
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build host config generator
        run: |
          cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host --target dh_config_gen
      - name: Build Android library
        run: |
          NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}"
          test -f "$NDK/build/cmake/android.toolchain.cmake" || { echo "NDK not found"; exit 1; }
          cmake -S . -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/android --target distant_horizons
      - name: Package .levipack
        run: scripts/package.sh build/android build/host dist/arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: levi-distant-horizons
          path: dist/arm64-v8a/levi-distant-horizons.levipack
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/arm64-v8a/levi-distant-horizons.levipack
